- quote: "Support from NJCIC has really made a difference for us over the past few years. Because of this funding, we&rsquo;ve developed and provided free training programs for many students who might not otherwise have access to professional media education."
  name: Neal Bennett
  org: Industry Media Arts

- quote: "NJCIC funding has allowed us to double-down on our coverage of Newark school board, providing a texting service that allows busy readers to get updates from the team about issues that matter most to them."
  name: Sarah Darville
  org: Chalkbeat Newark

- quote: "Because of NJCIC funding, we&rsquo;ve trained over 250 high school students in podcasting. We&rsquo;ve taken our students on two field trips to see how journalism works in the real world, and we&rsquo;ve allowed our students to engage with the news on a more personal and interactive level."
  name: Sarah Schillaci
  org: Wayne Hills High School

- quote: "Working with NJCIC has meant that we have been able to interact with all ages in our communities and all demographics, continuing to build new ways that we&rsquo;re helping our community understand what&rsquo;s happening in our local government."
  name: Victoria Mastellar
  org: coLAB Arts

- quote: "We first received funding from NJCIC 3 years ago, and it has allowed us to launch a fellowship program that has helped 9 NJ-based journalists build their careers in local journalism so far, with many more to come, we hope."
  name: Ambreen Ali
  org: Central Desi

- quote: "Thanks to the NJCIC, last year, we were able to establish a fully furnished video studio right in the heart of Trenton."
  name: Mark Sterling
  org: Central New Jersey Network
