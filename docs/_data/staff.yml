- name: Lisa Sahulka
  title: Executive Director
  photo: Lisa.png
  bio: "Lisa brings decades of experience leading mission-driven organizations. She previously served as COO at The Century Foundation and Southern Poverty Law Center, and as CFO for the Juvenile Welfare Board of Pinellas County, Florida. She has held leadership roles with CARE, Covenant House, and Jacob Riis Settlement House."

- name: Ayinde Merrill
  title: Program Officer
  photo: Ayinde.png
  bio: "A lifelong Camden resident and activist, Ayinde founded Watu Moja, connecting African American and Afro-Latino young adults to the global African community through arts and service. He holds a bachelor's in Afrikan Studies from Rutgers and a master's in Public Administration from the University of Pennsylvania."

- name: Madison McCool
  title: Grants + Communications Manager
  photo: Madi.png
  bio: "Madison (Madi) serves as the Grants and Communications Manager for the Consortium, where she leads the organization's communications strategy, supports the administration of grant programs, and manages back-office support. With a background in office management and communications, Madi plays a key role in connecting the Consortium's work with stakeholders including journalists, policymakers, universities, and community partners."
